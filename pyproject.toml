[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loudtalk"
version = "0.1.0"
description = "Voice commands for your agents in existing messengers, powered by Loudkit and Parakeet."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "LoudReader" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "mcp>=2.0,<3",
  "loudkit[torch,hub,audio]==0.1.1",
  "parakeet-mlx==0.5.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
discord = ["discord.py>=2.5,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24", "ruff>=0.12"]

[project.scripts]
loudtalk = "loudtalk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loudtalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


[project.urls]
Homepage = "https://loudkit.loudreader.io/agents/"
Repository = "https://github.com/loudreader/loudkit-voice"
Issues = "https://github.com/loudreader/loudkit-voice/issues"
